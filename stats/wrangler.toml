# LidarLinks' anonymous play-time count (stats/README.md). Deploy from this folder: npx wrangler@4.152.0 deploy
name = "lidarlinks-stats"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "lidarlinks-stats"
database_id = "c8b0e946-5cb7-495f-9fb8-6f274d06e61a"

[observability]
enabled = true

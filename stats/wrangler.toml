# LidarLinks' anonymous play-time count (stats/README.md). Deploy from this folder: npx wrangler@4.152.0 deploy
name = "lidarlinks-stats"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "lidarlinks-stats"
database_id = "c8b0e946-5cb7-495f-9fb8-6f274d06e61a"

[observability]
enabled = true

# A per-address limit (src/index.js, underLimit) on counts and on the open page, so one machine can't use up the
# account's daily D1 allowance (shared with OpenSGolf's boards). The game sends a count every 5 minutes.
[[ratelimits]]
name = "LIMITER"
namespace_id = "3972"

  [ratelimits.simple]
  limit = 60
  period = 60

# Previews: Workers Builds runs `npx wrangler preview` on every PR, and Wrangler
# refuses without a `previews` block. The rate limiter uses a new namespace id
# (3974, next after production's 3972) so Preview traffic never shares
# production's limiter. (Verified against Wrangler 4.168.0: `wrangler preview`
# only requires a `previews` block with no <REPLACE_ME> placeholders.)
#
# The D1 database is NOT in the previews block yet, on purpose: a Preview
# needs its own real D1 database, and its id cannot be invented. To finish
# this, run once (needs Cloudflare login):
#   npx wrangler d1 create lidarlinks-stats-preview
#   npx wrangler d1 execute lidarlinks-stats-preview --remote --file schema.sql
# then paste the new database id into the block below and uncomment it. Until
# then the Preview deploys without a DB binding: the build check passes, but
# /count and the stats page on a Preview URL will error instead of writing.
# Production's database is never pointed at from a Preview.
[[previews.ratelimits]]
name = "LIMITER"
namespace_id = "3974"

  [previews.ratelimits.simple]
  limit = 60
  period = 60

# [[previews.d1_databases]]
# binding = "DB"
# database_name = "lidarlinks-stats-preview"
# database_id = "<PASTE THE ID FROM `wrangler d1 create lidarlinks-stats-preview`>"

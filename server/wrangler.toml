# Cloudflare Worker for online play and leaderboards: see server/README.md.
# Cloudflare deploys it by itself from main (Workers Builds, root directory
# server/), or the manual "Deploy online server" workflow does.
name = "lidarlinks"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[durable_objects.bindings]]
name = "GAMES"
class_name = "GameObject"

[[durable_objects.bindings]]
name = "BOARDS"
class_name = "BoardObject"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject", "GameObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BoardObject"]

# A per-address limit on everything that makes or changes something (src/index.js, underLimit): 60 a minute is
# far more than any game sends (a shot or a round record at a time), and stops one machine flooding the free plan.
[[ratelimits]]
name = "LIMITER"
namespace_id = "3971"

  [ratelimits.simple]
  limit = 60
  period = 60

# Previews: Workers Builds runs `npx wrangler preview` on every PR, and Wrangler
# refuses without a `previews` block. Every binding the Worker reads from `env`
# needs a Preview-safe copy here. Durable Objects get a fresh namespace and
# storage per Preview automatically (same class names, no script_name), and the
# rate limiter uses a new namespace id (3973, next after production's 3971) so
# Preview traffic never shares production's limiter. No production data is
# touched. (Verified against Wrangler 4.168.0: `wrangler preview` only requires
# a `previews` block with no <REPLACE_ME> placeholders; it does not require
# every production binding to be mirrored.)
[[previews.durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[previews.durable_objects.bindings]]
name = "GAMES"
class_name = "GameObject"

[[previews.durable_objects.bindings]]
name = "BOARDS"
class_name = "BoardObject"

[[previews.ratelimits]]
name = "LIMITER"
namespace_id = "3973"

  [previews.ratelimits.simple]
  limit = 60
  period = 60

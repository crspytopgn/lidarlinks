# Deploys the online-play server (server/) to Cloudflare when it changes on
# main, or by hand. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets; without them it only runs the tests (Cloudflare's own Workers
# Builds can deploy instead, see server/README.md).
name: Deploy online server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]

jobs:
  deploy:
    name: Deploy online server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: node --test "server/test/*.test.js"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret: not deploying from here (see server/README.md)"
            exit 0
          fi
          cd server && npx --yes wrangler@4 deploy

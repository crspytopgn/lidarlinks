name: GDExtension
on:
  push:
    branches: [main, perf/**]
    paths:
      - "extensions/olcore/**"
      - "extensions/godot-cpp"
      - "libs/olcore/**"
      - "game/addons/olcore/**"
      - ".github/workflows/gdextension.yml"
  pull_request:
    paths:
      - "extensions/olcore/**"
      - "extensions/godot-cpp"
      - "libs/olcore/**"
      - "game/addons/olcore/**"
      - ".github/workflows/gdextension.yml"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: GDExtension (${{ matrix.os }}${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            cmake_arch: ""
          - os: windows-latest
            arch: x86_64
            cmake_arch: ""
          - os: macos-latest
            arch: arm64
            cmake_arch: "-DCMAKE_OSX_ARCHITECTURES=arm64"
          - os: macos-latest
            arch: x86_64
            cmake_arch: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GDEXTENSION=ON ${{ matrix.cmake_arch }}
      - name: Build extension
        run: cmake --build build --config Release --target olcore_gdext olcore_snapshot_tests --parallel 2
      - name: Test snapshot core
        run: ctest --test-dir build -C Release -R olcore_snapshot_tests --output-on-failure
      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: olcore-gdext-${{ matrix.os }}-${{ matrix.arch }}
          path: game/addons/olcore/bin/
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  core:
    name: Core library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Browser file import tests
        if: runner.os == 'Linux'
        run: node game/web/tests/test_game_files.mjs
      - name: Browser text input tests
        if: runner.os == 'Linux'
        run: node game/web/tests/test_text_input.mjs
      - name: Online server tests
        if: runner.os == 'Linux'
        run: node --test "server/test/*.test.js"
      - name: Upload olcourse
        uses: actions/upload-artifact@v4
        with:
          name: olcourse-${{ matrix.os }}
          path: |
            build/tools/olcourse/olcourse
            build/tools/olcourse/Release/olcourse.exe
          if-no-files-found: ignore

  # The launcher's own slim export templates (tools/templates/launcher.py:
  # no 3D, Compatibility renderer only, unused modules out), built from
  # Godot's source once per profile and Godot version, then cached.
  launcher-templates:
    name: Launcher templates (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linuxbsd
            os: ubuntu-latest
          - platform: windows
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache the template
        id: cache-template
        uses: actions/cache@v4
        with:
          path: template
          key: launcher-template-${{ matrix.platform }}-${{ env.GODOT_VERSION }}-angle-${{ hashFiles('tools/templates/launcher.py') }}
      - name: Build the template
        if: steps.cache-template.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pip3 install --break-system-packages scons 2>/dev/null || pip3 install scons
          curl -sSL -o /tmp/godot-src.tar.xz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/godot-${GODOT_VERSION}-stable.tar.xz"
          tar xf /tmp/godot-src.tar.xz -C /tmp
          src=/tmp/godot-${GODOT_VERSION}-stable
          profile=$PWD/tools/templates/launcher.py
          mkdir -p template
          # ANGLE (OpenGL over D3D11 / Metal), as in the official templates:
          # Windows and macOS fall back to it where native OpenGL is poor.
          # Each arch in its own angle-<arch> folder, which Godot 4.7's build
          # looks for next to angle_libs (misc/scripts/install_angle.py).
          angle() {
            curl -sSL -o /tmp/angle-$1.zip "https://github.com/godotengine/godot-angle-static/releases/download/chromium%2F7219/godot-angle-static-$1-release.zip"
            mkdir -p /tmp/angle-$1 && unzip -q -o /tmp/angle-$1.zip -d /tmp/angle-$1
          }
          case "${{ matrix.platform }}" in
            linuxbsd)
              (cd $src && scons platform=linuxbsd arch=x86_64 profile=$profile -j4)
              cp $src/bin/godot.linuxbsd.template_release.x86_64 template/linux_release.x86_64 ;;
            windows)
              sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
              sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
              sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
              angle x86_64-gcc
              # Godot 4.7's Windows platform switches D3D12 on over the profile.
              (cd $src && scons platform=windows arch=x86_64 use_mingw=yes d3d12=no winrt=no angle_libs=/tmp/angle profile=$profile -j4)
              cp $src/bin/godot.windows.template_release.x86_64.exe template/windows_release_x86_64.exe ;;
            macos)
              angle arm64-macos
              angle x86_64-macos
              # ANGLE needs these, which a build without Metal or Vulkan does not link.
              mac_frameworks="-framework IOSurface -framework Metal -framework QuartzCore"
              (cd $src && scons platform=macos arch=arm64 angle_libs=/tmp/angle linkflags="$mac_frameworks" profile=$profile -j3 \
                && scons platform=macos arch=x86_64 angle_libs=/tmp/angle linkflags="$mac_frameworks" profile=$profile -j3)
              lipo -create $src/bin/godot.macos.template_release.arm64 $src/bin/godot.macos.template_release.x86_64 \
                -output template/godot_macos_release.universal ;;
          esac
          ls -l template
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-template-${{ matrix.platform }}
          path: template

  export:
    name: Godot export
    needs: launcher-templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          mv /tmp/templates/templates/* "$dest/"

      # Free CC0 textures and sky from Poly Haven (not in the repo). A failed
      # download leaves the build untextured rather than failing it.
      - name: Fetch free assets
        run: |
          # Pillow builds the trees' leaf spray atlas from the leaf set;
          # numpy and Pillow prepare the free pack's textures.
          sudo apt-get update -q && sudo apt-get install -y -q python3-pil python3-numpy
          python3 tools/fetch_free_assets.py

      - name: Import project
        run: ~/godot/godot --headless --path game --import

      # Script errors don't change Godot's exit code, so check the log too.
      - name: GDScript tests
        run: |
          ~/godot/godot --headless --path game -s res://tests/run_tests.gd 2>&1 | tee godot-tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" godot-tests.log; then exit 1; fi
          grep -q "GODOT TESTS PASSED" godot-tests.log

      # Headless runs never compile shaders, so render real frames with Mesa's
      # software drivers: Compatibility (what the web build uses) on llvmpipe
      # and Forward+ on lavapipe. Script and shader errors fail the step.
      - name: Render check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          for method in gl_compatibility forward_plus; do
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path game --rendering-method $method \
              -s res://tests/render_check.gd -- "$PWD/render-$method.png" 2>&1 | tee render-$method.log
            if grep -E "SHADER ERROR|SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" render-$method.log; then exit 1; fi
            grep -q "RENDER CHECK DONE" render-$method.log
          done

      # Run the workflow by hand to get the screenshots in the log as base64,
      # for tools that can read logs but not download artifacts.
      - name: Print screenshots
        if: github.event_name == 'workflow_dispatch'
        run: |
          for f in render-*.jpg; do
            echo "BEGIN-SCREENSHOT $f"
            base64 -w 2000 "$f"
            echo "END-SCREENSHOT $f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-check
          path: render-*.*

      - name: Export Linux, Windows, macOS and Web
        run: |
          # The build shown on the main menu (game/scripts/build_info.gd).
          built=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s/^const COMMIT := \"dev\"/const COMMIT := \"${GITHUB_SHA::7}\"/; s/^const BUILT := \"\"/const BUILT := \"$built\"/" game/scripts/build_info.gd
          grep -q "${GITHUB_SHA::7}" game/scripts/build_info.gd
          cd game
          mkdir -p export/linux export/windows export/macos export/web
          ~/godot/godot --headless --export-release "Linux" export/linux/OpenLinks2003.x86_64
          ~/godot/godot --headless --export-release "Windows" export/windows/OpenLinks2003.exe
          ~/godot/godot --headless --export-release "macOS" export/macos/OpenLinks2003.zip
          ~/godot/godot --headless --export-release "Web" export/web/index.html
          ls -lR export
          test -s export/linux/OpenLinks2003.x86_64
          test -s export/windows/OpenLinks2003.exe
          test -s export/macos/OpenLinks2003.zip
          test -s export/web/index.html
          test -s export/web/index.wasm

      # The desktop launcher (launcher/, docs/launcher.md): its own tests,
      # then its three exports, stamped with launcher/'s git tree id so it
      # can tell when a newer launcher is on main.
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-template-*
          path: ${{ runner.temp }}/launcher-templates

      - name: Launcher tests
        run: |
          # Godot 4.4.1 sometimes segfaulted on a first headless import of the
          # launcher's fonts (main run 557 too); the tests below still have to
          # pass, so one more try is safe.
          ~/godot/godot --headless --path launcher --import || ~/godot/godot --headless --path launcher --import
          ~/godot/godot --headless --path launcher -s res://tests/run_tests.gd 2>&1 | tee launcher-tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" launcher-tests.log; then exit 1; fi
          grep -q "LAUNCHER TESTS PASSED" launcher-tests.log

      - name: Export the launcher
        run: |
          tree=$(git rev-parse HEAD:launcher)
          sed -i "s/^const LAUNCHER_TREE := \"dev\"/const LAUNCHER_TREE := \"$tree\"/" launcher/scripts/build_info.gd
          grep -q "$tree" launcher/scripts/build_info.gd
          # The launcher exports with its slim templates: a copy of the
          # official template folder (which stays cached as it is) with the
          # three release binaries swapped, found through XDG_DATA_HOME.
          official=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          export XDG_DATA_HOME=$RUNNER_TEMP/launcher-xdg
          slim=$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$slim"
          cp -r "$official"/. "$slim"/
          cp $RUNNER_TEMP/launcher-templates/launcher-template-linuxbsd/linux_release.x86_64 "$slim/"
          cp $RUNNER_TEMP/launcher-templates/launcher-template-windows/windows_release_x86_64.exe "$slim/"
          rm -rf $RUNNER_TEMP/macos-template && mkdir $RUNNER_TEMP/macos-template
          unzip -q "$official/macos.zip" -d $RUNNER_TEMP/macos-template
          cp $RUNNER_TEMP/launcher-templates/launcher-template-macos/godot_macos_release.universal \
            $RUNNER_TEMP/macos-template/macos_template.app/Contents/MacOS/godot_macos_release.universal
          chmod +x $RUNNER_TEMP/macos-template/macos_template.app/Contents/MacOS/*
          rm "$slim/macos.zip"
          (cd $RUNNER_TEMP/macos-template && zip -qry "$slim/macos.zip" .)
          cd launcher
          mkdir -p export/linux export/windows export/macos
          ~/godot/godot --headless --export-release "Linux" export/linux/OpenLinks2003-Launcher.x86_64
          ~/godot/godot --headless --export-release "Windows" "export/windows/OpenLinks2003 Launcher.exe"
          ~/godot/godot --headless --export-release "macOS" export/macos/OpenLinks2003-Launcher.zip
          # Smoke test: the slim Linux launcher starts and runs 300 frames
          # with no script or missing-class errors.
          HOME=$RUNNER_TEMP/launcher-home timeout 120 export/linux/OpenLinks2003-Launcher.x86_64 --headless --quit-after 300 2>&1 | tee $RUNNER_TEMP/launcher-run.log
          if grep -E "SCRIPT ERROR|Parse Error|Cannot get class|Failed to load script" $RUNNER_TEMP/launcher-run.log; then exit 1; fi
          ls -lR export
          test -s export/linux/OpenLinks2003-Launcher.x86_64
          test -s "export/windows/OpenLinks2003 Launcher.exe"
          test -s export/macos/OpenLinks2003-Launcher.zip

      # Download size per build and the biggest files in each pack, on the
      # job summary; fails when a build goes over tools/size_budget.json.
      - name: Size budget
        run: python3 tools/size_report.py --export game/export --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-linux
          path: game/export/linux
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-windows
          path: game/export/windows
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-macos
          path: game/export/macos
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-web
          path: game/export/web
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-launcher-linux
          path: launcher/export/linux
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-launcher-windows
          path: launcher/export/windows
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLinks2003-launcher-macos
          path: launcher/export/macos
      - name: Upload web build for GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/export/web

  # Publishes the desktop builds from main as the rolling "latest" release,
  # so there's a plain download link (artifacts need a GitHub login and
  # expire), and the launcher updates the game from it. The builds contain
  # no game data. One publish at a time, and only from the newest commit on
  # main: runs can finish out of order, and an older one must not replace a
  # newer build (the launcher would offer it as an "update").
  release:
    name: Publish latest release
    needs: export
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-latest-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenLinks2003-*
          path: dist
      - name: Package
        run: |
          ls -lR dist
          mkdir out
          cp dist/OpenLinks2003-macos/OpenLinks2003.zip out/OpenLinks2003-macOS.zip
          (cd dist/OpenLinks2003-windows && zip -qr ../../out/OpenLinks2003-Windows.zip .)
          chmod +x dist/OpenLinks2003-linux/OpenLinks2003.x86_64
          tar -C dist/OpenLinks2003-linux -czf out/OpenLinks2003-Linux.tar.gz .
          cp dist/OpenLinks2003-launcher-macos/OpenLinks2003-Launcher.zip out/OpenLinks2003-Launcher-macOS.zip
          (cd dist/OpenLinks2003-launcher-windows && zip -qr ../../out/OpenLinks2003-Launcher-Windows.zip .)
          chmod +x dist/OpenLinks2003-launcher-linux/OpenLinks2003-Launcher.x86_64
          tar -C dist/OpenLinks2003-launcher-linux -czf out/OpenLinks2003-Launcher-Linux.tar.gz .
          ls -l out
      - name: Update the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: |
            LidarLinks, built from main. No game data is included; the original courses load from your own Links 2003 files.

            **Launcher (recommended):** download OpenLinks2003-Launcher (the LidarLinks launcher) for your system. It installs the game, keeps it up to date, shows what's new, sets the options worth choosing before you play, and gets your Links 2003 discs, disc images or install ready.

            **macOS:** unzip, move the app to Applications, then right-click it and choose Open (the apps are ad-hoc signed, not notarized). On macOS 15 or later, if it still won't open, go to System Settings > Privacy & Security and click Open Anyway.

            LidarLinks is free, with no ads, and always will be. If you enjoy it, you can [support it on GitHub Sponsors](https://github.com/sponsors/crspytopgn). Thank you!
        run: |
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $head; its own run publishes the release."
            exit 0
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --title "Latest build (${GITHUB_SHA::7})" --notes "$NOTES" --target "$GITHUB_SHA" --prerelease

  # Publishes the web build to https://<owner>.github.io/<repo>/.
  # Requires a public repo (Pages on private repos needs a paid plan) and
  # Settings > Pages > Source set to "GitHub Actions". Skipped while private.
  # Re-deploy without a code change via Actions > CI > Run workflow.
  deploy-web:
    name: Deploy web build
    needs: export
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
